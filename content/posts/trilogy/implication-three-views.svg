<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc">
  <title id="title">Implication in logic, programming, and category theory</title>
  <desc id="desc">Three columns compare implication and modus ponens, function types and application, and exponential objects and evaluation.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.12"/></filter>
    <style>
      .heading { font: 700 36px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill:#0f172a; }
      .section { font: 700 25px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill:#0f172a; }
      .math { font: 600 24px "DejaVu Sans", Arial, sans-serif; fill:#0f172a; }
      .body { font: 500 18px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill:#334155; }
      .small { font: 600 16px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill:#475569; }
    </style>
  </defs>
  <rect x="18" y="18" width="1164" height="624" rx="34" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <text x="600" y="74" text-anchor="middle" class="heading">One construction, read three ways</text>

  <rect x="58" y="112" width="332" height="470" rx="27" fill="#fff7ed" stroke="#e76f51" stroke-width="3" filter="url(#shadow)"/>
  <text x="224" y="160" text-anchor="middle" class="section">Logic</text>
  <text x="224" y="213" text-anchor="middle" class="math">A → B</text>
  <text x="224" y="245" text-anchor="middle" class="body">implication</text>
  <line x1="98" y1="280" x2="350" y2="280" stroke="#fed7aa" stroke-width="2"/>
  <text x="224" y="326" text-anchor="middle" class="math">A     A → B</text>
  <line x1="132" y1="345" x2="316" y2="345" stroke="#0f172a" stroke-width="2"/>
  <text x="224" y="383" text-anchor="middle" class="math">B</text>
  <text x="224" y="421" text-anchor="middle" class="body">modus ponens</text>
  <rect x="94" y="462" width="260" height="76" rx="17" fill="#ffffff" stroke="#fdba74"/>
  <text x="224" y="492" text-anchor="middle" class="small">assume A, derive B,</text>
  <text x="224" y="517" text-anchor="middle" class="small">then discharge A</text>

  <rect x="434" y="112" width="332" height="470" rx="27" fill="#eff6ff" stroke="#2a6f97" stroke-width="3" filter="url(#shadow)"/>
  <text x="600" y="160" text-anchor="middle" class="section">Programming</text>
  <text x="600" y="213" text-anchor="middle" class="math">A → B</text>
  <text x="600" y="245" text-anchor="middle" class="body">function type</text>
  <line x1="474" y1="280" x2="726" y2="280" stroke="#bfdbfe" stroke-width="2"/>
  <text x="600" y="326" text-anchor="middle" class="math">a : A     f : A → B</text>
  <line x1="493" y1="345" x2="707" y2="345" stroke="#0f172a" stroke-width="2"/>
  <text x="600" y="383" text-anchor="middle" class="math">f a : B</text>
  <text x="600" y="421" text-anchor="middle" class="body">function application</text>
  <rect x="470" y="462" width="260" height="76" rx="17" fill="#ffffff" stroke="#93c5fd"/>
  <text x="600" y="492" text-anchor="middle" class="small">fun x =&gt; t</text>
  <text x="600" y="517" text-anchor="middle" class="small">lambda abstraction</text>

  <rect x="810" y="112" width="332" height="470" rx="27" fill="#ecfdf5" stroke="#2a9d8f" stroke-width="3" filter="url(#shadow)"/>
  <text x="976" y="160" text-anchor="middle" class="section">Category theory</text>
  <text x="976" y="213" text-anchor="middle" class="math">B^A</text>
  <text x="976" y="245" text-anchor="middle" class="body">exponential object</text>
  <line x1="850" y1="280" x2="1102" y2="280" stroke="#a7f3d0" stroke-width="2"/>
  <text x="976" y="326" text-anchor="middle" class="math">B^A × A</text>
  <path d="M 905 360 C 936 390, 1016 390, 1047 360" fill="none" stroke="#0f172a" stroke-width="2.5"/>
  <path d="M 1038 355 L 1049 360 L 1040 368" fill="none" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="976" y="409" text-anchor="middle" class="math">B</text>
  <text x="976" y="442" text-anchor="middle" class="body">evaluation morphism</text>
  <rect x="846" y="452" width="260" height="94" rx="17" fill="#ffffff" stroke="#6ee7b7"/>
  <text x="976" y="480" text-anchor="middle" class="small">Hom(C × A, B)</text>
  <text x="976" y="505" text-anchor="middle" class="small">natural bijection</text>
  <text x="976" y="530" text-anchor="middle" class="small">Hom(C, B^A)</text>

  <text x="600" y="620" text-anchor="middle" class="body">abstraction = implication introduction = currying · application = modus ponens = evaluation</text>
</svg>
