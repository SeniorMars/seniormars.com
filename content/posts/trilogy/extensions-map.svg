<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Extensions of the computational trilogy</title>
  <desc id="desc">The classical triangle of logic, typed programs, and cartesian categories extends toward dependent types, homotopy type theory, effects and control, substructural systems, and quantum processes.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <style>
      .heading { font: 700 36px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .name { font: 700 23px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .body { font: 500 17px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; }
      .small { font: 600 15.5px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .tag { font: 600 15px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
    </style>
  </defs>

  <rect x="18" y="18" width="1164" height="864" rx="34" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <text x="600" y="70" text-anchor="middle" class="heading">The triangle does not end at simple types</text>

  <path d="M430 330 C365 290, 315 255, 260 220" fill="none" stroke="#64748b" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M770 330 C835 290, 885 255, 940 220" fill="none" stroke="#64748b" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M430 590 C335 625, 270 660, 210 705" fill="none" stroke="#64748b" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M600 610 L600 705" fill="none" stroke="#64748b" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M770 590 C865 625, 930 660, 990 705" fill="none" stroke="#64748b" stroke-width="3.5" stroke-linecap="round"/>

  <rect x="62" y="100" width="370" height="136" rx="23" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="3" filter="url(#shadow)"/>
  <text x="247" y="142" text-anchor="middle" class="name">Dependent types</text>
  <text x="247" y="178" text-anchor="middle" class="body">Pi- and Sigma-types · quantifiers</text>
  <text x="247" y="206" text-anchor="middle" class="body">slices · fibrations · LCCCs</text>

  <rect x="768" y="100" width="370" height="136" rx="23" fill="#ecfeff" stroke="#0891b2" stroke-width="3" filter="url(#shadow)"/>
  <text x="953" y="142" text-anchor="middle" class="name">Homotopical structure</text>
  <text x="953" y="178" text-anchor="middle" class="body">identity types as paths</text>
  <text x="953" y="206" text-anchor="middle" class="body">univalence · infinity-groupoids</text>

  <rect x="280" y="255" width="246" height="34" rx="17" fill="#ffffff" stroke="#d8b4fe"/>
  <text x="403" y="278" text-anchor="middle" class="tag">outputs depend on inputs</text>
  <rect x="674" y="255" width="246" height="34" rx="17" fill="#ffffff" stroke="#a5f3fc"/>
  <text x="797" y="278" text-anchor="middle" class="tag">identity gains higher structure</text>

  <rect x="330" y="315" width="540" height="300" rx="30" fill="#ffffff" stroke="#8b5cf6" stroke-width="3" filter="url(#shadow)"/>
  <text x="600" y="359" text-anchor="middle" class="name">Classical computational trilogy</text>

  <circle cx="600" cy="421" r="43" fill="#fff7ed" stroke="#e76f51" stroke-width="2.5"/>
  <text x="600" y="427" text-anchor="middle" class="small">logic</text>

  <circle cx="480" cy="515" r="52" fill="#eff6ff" stroke="#2a6f97" stroke-width="2.5"/>
  <text x="480" y="508" text-anchor="middle" class="small">typed</text>
  <text x="480" y="531" text-anchor="middle" class="small">programs</text>

  <circle cx="720" cy="515" r="52" fill="#ecfdf5" stroke="#2a9d8f" stroke-width="2.5"/>
  <text x="720" y="508" text-anchor="middle" class="small">cartesian</text>
  <text x="720" y="531" text-anchor="middle" class="small">categories</text>

  <path d="M573 455 L520 489 M627 455 L680 489 M532 515 H668" fill="none" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
  <text x="600" y="584" text-anchor="middle" class="body">intuitionistic propositions · simply typed lambda calculus · CCCs</text>

  <rect x="30" y="710" width="356" height="140" rx="23" fill="#fff7ed" stroke="#e76f51" stroke-width="3" filter="url(#shadow)"/>
  <text x="208" y="752" text-anchor="middle" class="name">Effects and control</text>
  <text x="208" y="788" text-anchor="middle" class="body">monads · continuations</text>
  <text x="208" y="816" text-anchor="middle" class="body">modalities · operational semantics</text>

  <rect x="422" y="710" width="356" height="140" rx="23" fill="#eff6ff" stroke="#2a6f97" stroke-width="3" filter="url(#shadow)"/>
  <text x="600" y="752" text-anchor="middle" class="name">Substructural systems</text>
  <text x="600" y="788" text-anchor="middle" class="body">affine · relevant · linear</text>
  <text x="600" y="816" text-anchor="middle" class="body">resource-aware type systems</text>

  <rect x="814" y="710" width="356" height="140" rx="23" fill="#ecfdf5" stroke="#2a9d8f" stroke-width="3" filter="url(#shadow)"/>
  <text x="992" y="752" text-anchor="middle" class="name">Quantum processes</text>
  <text x="992" y="788" text-anchor="middle" class="body">symmetric monoidal structure</text>
  <text x="992" y="816" text-anchor="middle" class="body">daggers · compactness · protocols</text>

  <rect x="163" y="650" width="158" height="34" rx="17" fill="#ffffff" stroke="#fed7aa"/>
  <text x="242" y="673" text-anchor="middle" class="tag">add effects</text>
  <rect x="504" y="650" width="192" height="34" rx="17" fill="#ffffff" stroke="#bfdbfe"/>
  <text x="600" y="673" text-anchor="middle" class="tag">restrict structural rules</text>
  <rect x="834" y="650" width="270" height="34" rx="17" fill="#ffffff" stroke="#a7f3d0"/>
  <text x="969" y="673" text-anchor="middle" class="tag">replace free copying with tensor</text>
</svg>
